<div class="analysis-overlay">
  <div class="analysis-card">
    <div class="analysis-icon">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4">
        <circle cx="16" cy="16" r="12"/>
        <path d="M16 9v7l5 3"/>
      </svg>
    </div>
    <h3 class="analysis-title">Analyzing your question</h3>
    <p class="analysis-subtitle">GeoMind is combining geographic data, spatial analysis and AI to generate insights.</p>

    <ul class="step-list">
      @for (step of steps; track step.label; let i = $index) {
        <li class="step-item" [class.done]="isDone(i)" [class.active]="isActive(i)">
          <span class="step-marker">
            @if (isDone(i)) {
              <svg width="12" height="12" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 6.8l2.7 2.7 5.3-5.9"/>
              </svg>
            } @else if (isActive(i)) {
              <span class="spinner"></span>
            }
          </span>
          <span class="step-label">{{ step.label }}</span>
        </li>
      }
    </ul>

    <div class="progress-track">
      <div class="progress-fill" [style.width.%]="progress"></div>
    </div>
    <div class="progress-caption">
      <span>Processing geographic data...</span>
      <span>{{ progress }}%</span>
    </div>
  </div>
</div>
