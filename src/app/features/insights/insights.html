<div class="insight-panel">
  <div class="insight-header">
    <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 13.5h5"/>
      <path d="M7 15.5h4"/>
      <path d="M9 2.5c-2.8 0-5 2.1-5 4.9 0 1.8 1 3 1.9 3.9.6.6 1 1.1 1.1 1.7h4c.1-.6.5-1.1 1.1-1.7.9-.9 1.9-2.1 1.9-3.9 0-2.8-2.2-4.9-5-4.9Z"/>
    </svg>
    <h3>AI insight</h3>
  </div>

  <p class="insight-summary">{{ result.summary }}</p>

  <div class="stat-grid">
    <div class="stat-cell">
      <span class="stat-value">{{ result.statistics.total_features }}</span>
      <span class="stat-label">Areas analyzed</span>
    </div>
    <div class="stat-cell">
      <span class="stat-value">{{ result.statistics.high_need_areas }}</span>
      <span class="stat-label">High-need areas</span>
    </div>
  </div>

  <div class="insight-detail">
    <h4>Why it matters</h4>
    <p>{{ result.insight }}</p>
  </div>
</div>
