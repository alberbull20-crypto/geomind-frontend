<aside class="sidebar">
  <nav class="nav-list">
    @for (item of navItems; track item.path) {
      <a class="nav-item" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{exact: item.path === '/'}">
        <span class="nav-icon">
          @switch (item.icon) {
            @case ('workspace') {
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4">
                <rect x="1.5" y="1.5" width="6" height="6" rx="1"/>
                <rect x="10.5" y="1.5" width="6" height="6" rx="1"/>
                <rect x="1.5" y="10.5" width="6" height="6" rx="1"/>
                <rect x="10.5" y="10.5" width="6" height="6" rx="1"/>
              </svg>
            }
            @case ('analyze') {
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                <line x1="3" y1="15" x2="3" y2="9"/>
                <line x1="9" y1="15" x2="9" y2="4"/>
                <line x1="15" y1="15" x2="15" y2="11"/>
              </svg>
            }
            @case ('data') {
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4">
                <ellipse cx="9" cy="4" rx="6" ry="2.2"/>
                <path d="M3 4v10c0 1.2 2.7 2.2 6 2.2s6-1 6-2.2V4"/>
                <path d="M3 9c0 1.2 2.7 2.2 6 2.2s6-1 6-2.2"/>
              </svg>
            }
            @case ('insights') {
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6.5 13.5h5"/>
                <path d="M7 15.5h4"/>
                <path d="M9 2.5c-2.8 0-5 2.1-5 4.9 0 1.8 1 3 1.9 3.9.6.6 1 1.1 1.1 1.7h4c.1-.6.5-1.1 1.1-1.7.9-.9 1.9-2.1 1.9-3.9 0-2.8-2.2-4.9-5-4.9Z"/>
              </svg>
            }
            @case ('history') {
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="9" r="7"/>
                <path d="M9 5v4l3 2"/>
              </svg>
            }
          }
        </span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <a class="nav-item settings" routerLink="/settings">
    <span class="nav-icon">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4">
        <circle cx="9" cy="9" r="2.6"/>
        <path d="M9 2.2v1.8M9 14v1.8M15.8 9h-1.8M3.998 9h-1.8M13.6 4.4l-1.3 1.3M5.7 12.3l-1.3 1.3M13.6 13.6l-1.3-1.3M5.7 5.7 4.4 4.4"/>
      </svg>
    </span>
    <span class="nav-label">Settings</span>
  </a>
</aside>
