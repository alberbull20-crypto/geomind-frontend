<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.3">
      <circle cx="11" cy="11" r="8.5"/>
      <ellipse cx="11" cy="11" rx="8.5" ry="3.6"/>
      <line x1="2.5" y1="11" x2="19.5" y2="11"/>
      <line x1="11" y1="2.5" x2="11" y2="19.5"/>
    </svg>
    <span class="brand-name">GeoMind AI</span>
  </div>

  <div class="search-box">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <circle cx="7" cy="7" r="5"/>
      <line x1="11" y1="11" x2="14.5" y2="14.5"/>
    </svg>
    <input type="text" placeholder="Search location (e.g., Nairobi, Kenya)" />
  </div>

  <div class="topbar-right">
    <span class="location-pill">
      <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round">
        <path d="M7 13S12 8.5 12 5.5A5 5 0 0 0 2 5.5C2 8.5 7 13 7 13Z"/>
        <circle cx="7" cy="5.5" r="1.6"/>
      </svg>
      {{ location }}
    </span>
    <div class="avatar">{{ userInitial }}</div>
  </div>
</header>
